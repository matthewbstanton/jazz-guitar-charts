name: Build PDFs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LilyPond
        run: sudo apt-get update && sudo apt-get install -y lilypond

      - name: Build PDFs
        run: ./build.sh

      - name: Release PDFs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          make_latest: true
          files: |
            output/*.pdf
            output/songs/*.pdf
