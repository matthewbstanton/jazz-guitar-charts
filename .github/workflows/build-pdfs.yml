name: Build PDFs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LilyPond
        env:
          LILYPOND_VERSION: "2.26.0"
        run: |
          curl -sL -o lilypond.tar.gz \
            "https://gitlab.com/api/v4/projects/lilypond%2Flilypond/packages/generic/lilypond/${LILYPOND_VERSION}/lilypond-${LILYPOND_VERSION}-linux-x86_64.tar.gz"
          tar xzf lilypond.tar.gz
          echo "$PWD/lilypond-${LILYPOND_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build PDFs
        run: ./build.sh

      - name: Zip PDFs
        run: (cd output && zip -r ../jazz-guitar-charts.zip .)

      # GitHub drops "#" from a release asset's name, and the upload then
      # fails, so the PDFs are copied to one folder with it spelled out:
      # a-shaped-scales-f#.pdf is released as a-shaped-scales-f-sharp.pdf
      - name: Collect release PDFs
        run: |
          mkdir release
          find output/sheets output/songs -name '*.pdf' -exec cp {} release/ \;
          for f in release/*'#'*; do
            [ -e "$f" ] || continue
            mv "$f" "${f//#/-sharp}"
          done

      - name: Release PDFs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          make_latest: true
          files: |
            release/*.pdf
            jazz-guitar-charts.zip
